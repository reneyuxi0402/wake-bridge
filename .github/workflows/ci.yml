name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-24.04
        node:
          - 20
          - 24
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install SQLite CLI on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        if: runner.os != 'macOS' || matrix.node != 20
        run: npm test

      - name: Test with bounded stall diagnostics
        if: runner.os == 'macOS' && matrix.node == 20
        timeout-minutes: 15
        run: |
          node --test .github/scripts/ci-diagnostic-selftest.mjs
          node .github/scripts/ci-test-diagnostic.mjs

      - name: Upload bounded stall evidence
        if: always() && runner.os == 'macOS' && matrix.node == 20
        uses: actions/upload-artifact@v7
        with:
          name: macos-node20-test-diagnostic-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            ci-test-evidence/metadata.json
            ci-test-evidence/diagnostic.jsonl
            ci-test-evidence/sample-node.txt
            ci-test-evidence/sample-sqlite3.txt
            ci-test-evidence/result.json
